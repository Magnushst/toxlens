name: toxlens
channels:
  - conda-forge
  - nvidia
  - pyg
  - pytorch
dependencies:
  - python=3.12.12
  - numpy=1.26.4
  - scipy=1.17.1
  - pandas=3.0.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - rdkit=2025.09.3
  - openbabel=3.1.1
  - umap-learn=0.5.9.post2
  - hdbscan=0.8.39
  - python-igraph=0.11.6
  - pytorch-cuda=12.1
  - pyg=2.6.1
  - pip=25.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu124.html
      - torch==2.4.1+cu124
      - torchvision==0.19.1+cu124
      - torch-scatter==2.1.2+pt24cu124
      - torch-sparse==0.6.18+pt24cu124
      - lightning==2.6.0
      - torchmetrics==1.8.2
      - captum==0.8.0
      - pyg-captum-shap==0.1.5
      - transformers==5.3.0
      - molfeat==0.10.1
      - datamol==0.12.5
      - mordredcommunity==2.0.6
      - pmapper==1.1.3
      - pytdc==0.3.8
      - deepchem==2.8.0
      - joblib==1.5.3
      - xgboost==3.1.2
      - shap==0.46.0
      - tqdm==4.67.3
